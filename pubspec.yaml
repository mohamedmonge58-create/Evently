name: evently
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  shared_preferences: ^2.5.3
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  introduction_screen: ^4.0.0
  location: ^10.0.2
  provider: ^6.1.5+1
  calendar_date_picker2: ^3.0.0
  image_picker: ^1.2.3
  flutter_gen: ^5.15.0
  firebase_core: ^4.14.0
  google_sign_in: ^7.2.0
  flutter_switch: ^0.3.2
  intl: ^0.20.3
  flutter_easyloading: ^4.0.2
  bot_toast: ^4.1.3
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_v4_1.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  flutter_test:
      sdk: flutter



  flutter_lints: ^6.0.0



  flutter_gen_runner: ^5.8.0
  build_runner: ^2.4.13

flutter_gen:
  output: lib/core/config/gen/
  integrations:
    image: true
    flutter_svg: true

flutter:


  uses-material-design: true

  assets:
     - assets/images/
     - assets/icons/



  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
